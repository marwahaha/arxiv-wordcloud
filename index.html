<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>arxiv-wordcloud</title>
</head>

<body>
    <p>Create wordclouds from arXiv abstracts (<a href="https://marwahaha.github.io/ncbi-wordcloud/">use PubMed? click here</a>)</p>
    <p>
        Examples:
        <a href="./uchicagocs/">UChicago CS Research</a> (14MB),
        <a href="./berkeleyeecs/">Berkeley EECS Research</a> (29MB)
    </p>
    <form onsubmit="updateParams(); return false;">
        <label for="author">Search an author:</label> <input id="author" required><button type="submit">Search</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <canvas id="canvas" style="margin:10px;" width="800" height="400"></canvas>

    <script src="wordcloud2.js"></script>
    <script>
        // https://github.com/amueller/word_cloud/blob/5f23ed47727eb97c45883fd34f98cd62a1c8a55b/wordcloud/stopwords
        var STOPWORDS = ["a", "about", "above", "after", "again", "against", "all", "also", "am", "an", "and", "any", "are", "aren't", "as", "at", "be", "because", "been", "before", "being", "below", "between", "both", "but", "by", "can", "can't", "cannot", "com", "could", "couldn't", "did", "didn't", "do", "does", "doesn't", "doing", "don't", "down", "during", "each", "else", "ever", "few", "for", "from", "further", "get", "had", "hadn't", "has", "hasn't", "have", "haven't", "having", "he", "he'd", "he'll", "he's", "hence", "her", "here", "here's", "hers", "herself", "him", "himself", "his", "how", "how's", "however", "http", "i", "i'd", "i'll", "i'm", "i've", "if", "in", "into", "is", "isn't", "it", "it's", "its", "itself", "just", "k", "let's", "like", "me", "more", "most", "mustn't", "my", "myself", "no", "nor", "not", "of", "off", "on", "once", "only", "or", "other", "otherwise", "ought", "our", "ours", "ourselves", "out", "over", "own", "r", "same", "shall", "shan't", "she", "she'd", "she'll", "she's", "should", "shouldn't", "since", "so", "some", "such", "than", "that", "that's", "the", "their", "theirs", "them", "themselves", "then", "there", "there's", "therefore", "these", "they", "they'd", "they'll", "they're", "they've", "this", "those", "through", "to", "too", "under", "until", "up", "very", "was", "wasn't", "we", "we'd", "we'll", "we're", "we've", "were", "weren't", "what", "what's", "when", "when's", "where", "where's", "which", "while", "who", "who's", "whom", "why", "why's", "with", "won't", "would", "wouldn't", "www", "you", "you'd", "you'll", "you're", "you've", "your", "yours", "yourself", "yourselves"];
        STOPWORDS.push("e.g.");
        STOPWORDS.push("i.e.");
        STOPWORDS.push("paper");
        STOPWORDS.push("new");

        // 'viridis' from matplotlib
        var COLORS = [
            'rgb(68.08602, 1.24287, 84.000825)',
            'rgb(70.173705, 49.700775, 126.481275)',
            'rgb(54.160725, 91.719165, 140.68605)',
            'rgb(39.10782, 126.735, 142.21962)',
            'rgb(31.18956, 161.454015, 135.25149)',
            'rgb(73.674855, 193.39047, 109.24863)',
            'rgb(159.777645, 217.934475, 56.955015)',
            'rgb(253.27824, 231.070035, 36.70368)',
        ];

        // fill canvas
        canvas = document.getElementById('canvas');
        var ctx = canvas.getContext("2d");
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.fill();

        function buildCloud(author) {
            var status = document.getElementById('status');
            status.textContent = 'Loading abstracts for ' + author + '…';
            var query = new URL('https://export.arxiv.org/api/query');
            query.searchParams.set('search_query', 'au:"' + author + '"');
            query.searchParams.set('max_results', '200');
            // Serve this author's saved arXiv feed from the site itself. Public
            // CORS proxies can time out or be blocked even when arXiv is working.
            var savedAuthor = author.trim().toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ') === 'kunal marwaha';
            var feedUrl = savedAuthor ? 'feeds/kunal-marwaha.xml' :
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(query.href);
            fetch(feedUrl, {
                signal: AbortSignal.timeout(30000)
            })
                .then(r => {
                    if (!r.ok) throw new Error('Request failed: ' + r.status);
                    return r.text();
                })
                .then(t => {
                    var feed = new DOMParser().parseFromString(t, 'application/xml');
                    if (feed.querySelector('parsererror') || feed.documentElement.localName !== 'feed') {
                        throw new Error('Invalid arXiv response');
                    }
                    var entries = Array.from(feed.getElementsByTagNameNS('http://www.w3.org/2005/Atom', 'entry'));
                    if (entries.some(entry => /\/api\/errors(?:#|$)/.test(entry.querySelector('id')?.textContent || ''))) {
                        throw new Error('arXiv rejected the query');
                    }
                    var summaries = entries.map(entry => entry.querySelector('summary')?.textContent || '').join(' ');
                    // remove common words and math words
                    var words = summaries.split(/[\s,]+/)
                        .filter(Boolean)
                        .map(w => w.replace(/[\(\)\"\'\.]/g, ''))
                        .filter(w => STOPWORDS.indexOf(w.toLowerCase()) === -1)
                        .filter(w => w.indexOf("$") === -1 && w.indexOf("\\") !== 0 && w.indexOf('&') !== 0)
                        .filter(w => w.length >= 3);

                    // remove plurals
                    for (var idx = 0; idx < words.length; idx++) {
                        if (words[idx].substr(-2) !== 'ss' && words[idx].substr(-1) === 's') {
                            singular = words[idx].slice(0, -1)
                            if (words.indexOf(singular) !== -1) {
                                words[idx] = singular;
                            }
                        }
                    }
                    // remove multicase
                    for (var idx = 0; idx < words.length; idx++) {
                        lowercase = words[idx].toLowerCase();
                        if (words[idx] !== lowercase) {
                            if (words.indexOf(lowercase) !== -1) {
                                words[idx] = lowercase;
                            }
                        }
                    }

                    var groupedWords = groupSimilar(words).sort((a, b) => b[1] - a[1]).slice(0, 200);
                    if (!groupedWords.length) {
                        status.textContent = 'No abstracts found for ' + author + '.';
                        return;
                    }
                    status.textContent = 'Wordcloud from ' + entries.length + ' arXiv abstracts for ' + author + '.';
                    if (savedAuthor) {
                        var savedDate = feed.getElementsByTagNameNS('http://www.w3.org/2005/Atom', 'updated')[0]?.textContent;
                        if (savedDate) status.textContent += ' Saved ' + savedDate.slice(0, 10) + '.';
                    }

                    // display wordcloud
                    canvas = document.getElementById('canvas');
                    width = parseInt(canvas.width, 10);
                    height = parseInt(canvas.height, 10);
                    var lastSize = (groupedWords[0] || [0, 0])[1];
                    var lastWeight = height / 3;

                    var rs = 0.9;
                    WordCloud(canvas, {
                        minSize: 4,
                        list: groupedWords,
                        gridSize: 8,
                        weightFactor: function (size) {
                            lastWeight = lastWeight * ((1 - rs) + rs * (size / lastSize));
                            lastSize = size;
                            return lastWeight;
                        },

                        color: function () {
                            // random from 0 to 255
                            val = parseInt((Math.random() * 8), 10);
                            return COLORS[val];
                        },
                        rotateRatio: 0.1,
                        rotationSteps: 2,
                        backgroundColor: 'black',
                        shape: 'square',
                        ellipticity: 0.5,
                    });
                })
                .catch(error => {
                    console.error(error);
                    status.textContent = 'Could not load arXiv abstracts. Please try searching again.';
                });
        }

        function groupSimilar(arr) {
            return arr.reduce((acc, val) => {
                const { data, map } = acc;
                const ind = map.get(val);
                if (map.has(val)) {
                    data[ind][1]++;
                } else {
                    map.set(val, data.push([val, 1]) - 1);
                }
                return { data, map };
            }, {
                data: [],
                map: new Map()
            }).data;
        };

        var params = new URLSearchParams(window.location.search);
        var author = params.get('author');
        if (author && author.trim()) {
            document.getElementById('author').value = author;
            buildCloud(author.trim().replace(/-/g, '_').replace(/'/g, ''));
        }

        function updateParams() {
            var author = document.getElementById('author').value.trim();
            if (!author) return;
            var params = new URLSearchParams(window.location.search);
            params.set('author', author);
            window.location.search = params.toString();
        }
    </script>
</body>

</html>
